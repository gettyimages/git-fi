name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm test

  # Fail if the committed man page, completions, or docs tables are stale — i.e.
  # someone changed src/help.ts without re-running the generator. Keeps the
  # generated artifacts honest, since they ship in the npm package and the docs
  # site without being regenerated at publish time.
  #
  # The check itself is the `verify:generated` npm script, so a contributor can
  # reproduce this failure locally with the same command rather than reading it
  # out of this file. (`npm test` regenerates as it runs, so it can't catch
  # drift — this job is what guards a commit that skipped the test loop.)
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Verify generated files are up to date
        run: |
          npm run verify:generated || {
            echo "::error::Generated files are stale. Run 'npm run gen:docs' and commit the result."
            exit 1
          }
