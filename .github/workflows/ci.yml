name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Windows is a matrix dimension rather than a single extra job because git-fi
  # takes a different path where the platform has no POSIX file modes — it
  # stores the token without setting or checking 0600 (AUTH-04) — and because
  # node's own Windows behavior (path handling, spawn, the test runner) varies
  # by version, so pinning one version would cover the platform but not the
  # combination.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Both active LTS lines, plus Current for early warning on what becomes
        # the next LTS. The low end is the `engines` floor in package.json.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm test

  # Fail if the committed man page, completions, or docs tables are stale — i.e.
  # someone changed src/help.ts without re-running the generator. Keeps the
  # generated artifacts honest, since they ship in the npm package and the docs
  # site without being regenerated at publish time.
  #
  # The check itself is the `verify:generated` npm script, so a contributor can
  # reproduce this failure locally with the same command rather than reading it
  # out of this file. (`npm test` regenerates as it runs, so it can't catch
  # drift — this job is what guards a commit that skipped the test loop.)
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Verify generated files are up to date
        run: |
          npm run verify:generated || {
            echo "::error::Generated files are stale. Run 'npm run gen:docs' and commit the result."
            exit 1
          }
